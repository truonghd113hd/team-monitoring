services:
  mongodb:
    build:
      context: ./docker/mongodb
      dockerfile: Dockerfile
    image: invo-mongodb:latest
    pull_policy: build
    container_name: invo-mongodb
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - invo-network

  backend:
    build:
      context: ./invo-admin-backend
      dockerfile: Dockerfile
    image: invo-admin-backend:latest
    pull_policy: build
    container_name: invo-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - ./invo-admin-backend/.env
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/invo-admin?authSource=admin
      - NODE_ENV=production
    volumes:
      - ./invo-admin-backend/credentials.json:/app/credentials.json:ro
      - ./invo-admin-backend/ssh-keys:/app/ssh-keys:ro
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - invo-network

  frontend:
    build:
      context: ./invo-admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.monitoring.invoring.com/api
    image: invo-admin-frontend:latest
    pull_policy: build
    container_name: invo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.monitoring.invoring.com/api
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - invo-network

volumes:
  mongo_data:

networks:
  invo-network:
    driver: bridge
